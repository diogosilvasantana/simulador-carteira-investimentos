[project]
name = "mt5-bridge"
version = "0.1.0"
description = "Ponte entre o MetaTrader 5 e o backend do simulador de carteira"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Só instalável no Windows, onde roda o terminal MT5
mt5 = ["MetaTrader5"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "spikes"]

[[tool.mypy.overrides]]
module = ["MetaTrader5"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
