# Fonte da verdade dos rótulos do repositório. Sincronizados pelo workflow labels.yml.
# Descrições sem emoji: o label-sync recusa caracteres Unicode de 4 bytes.
# Para renomear um rótulo sem perder as issues ligadas a ele, use "aliases".

# Tipo de mudança (aplicado pelo nome da branch)
- name: "type: feature"
  color: "1f883d"
  description: "Nova funcionalidade"
  aliases: ["história"]
- name: "type: fix"
  color: "d1242f"
  description: "Correção de bug"
  aliases: ["bug"]
- name: "type: hotfix"
  color: "b60205"
  description: "Correção urgente direto da produção"
- name: "type: refactor"
  color: "8250df"
  description: "Melhoria interna sem mudar comportamento"
- name: "type: perf"
  color: "fbca04"
  description: "Desempenho"
- name: "type: test"
  color: "0e8a16"
  description: "Testes"
- name: "type: docs"
  color: "0969da"
  description: "Documentação e ADRs"
  aliases: ["docs", "documentation"]
- name: "type: chore"
  color: "6e7781"
  description: "Manutenção, configuração e ferramentas"
  aliases: ["chore"]
- name: "type: ci"
  color: "57606a"
  description: "Pipelines e automação"
  aliases: ["ci"]
- name: "type: release"
  color: "5319e7"
  description: "Versão sendo promovida para produção"

# Área do monorepo (aplicado pelos arquivos alterados)
- name: "area: backend"
  color: "f9d0c4"
  description: "Java / Spring Boot"
  aliases: ["backend"]
- name: "area: frontend"
  color: "fef2c0"
  description: "Angular"
  aliases: ["frontend"]
- name: "area: bridge"
  color: "c5def5"
  description: "Ponte MT5 em Python"
  aliases: ["bridge"]
- name: "area: infra"
  color: "d4c5f9"
  description: "Docker, Coolify, deploy"
  aliases: ["infra"]
- name: "area: docs"
  color: "bfdadc"
  description: "Pasta docs/"
- name: "area: ci"
  color: "e4e669"
  description: "Workflows do GitHub"

# Módulos de negócio
- name: "module: identity"
  color: "ededed"
  description: "Usuários e autenticação"
  aliases: ["identity"]
- name: "module: marketdata"
  color: "ededed"
  description: "Cotações, candles, replay"
  aliases: ["marketdata"]
- name: "module: trading"
  color: "ededed"
  description: "Ordens e execução"
  aliases: ["trading"]
- name: "module: portfolio"
  color: "ededed"
  description: "Carteiras e posições"
  aliases: ["portfolio"]
- name: "module: corporateactions"
  color: "ededed"
  description: "Proventos e eventos societários"
- name: "module: fixedincome"
  color: "ededed"
  description: "Renda fixa e indexadores"
  aliases: ["fixedincome"]
- name: "module: analytics"
  color: "ededed"
  description: "Rentabilidade e rebalanceamento"

# Tamanho do PR (aplicado automaticamente)
- name: "size: XS"
  color: "3cbf00"
  description: "Até 10 linhas alteradas"
- name: "size: S"
  color: "5d9801"
  description: "Até 100 linhas"
- name: "size: M"
  color: "7f7203"
  description: "Até 500 linhas"
- name: "size: L"
  color: "a14c05"
  description: "Até 1000 linhas"
- name: "size: XL"
  color: "c32607"
  description: "Mais de 1000 linhas: considere dividir"

# Situação e prioridade
- name: "status: blocked"
  color: "b60205"
  description: "Depende de outra coisa"
- name: "status: needs review"
  color: "fbca04"
  description: "Pronto para revisão"
- name: "priority: high"
  color: "d93f0b"
  description: "Prioridade alta"
- name: "breaking change"
  color: "b60205"
  description: "Quebra compatibilidade"
- name: "dependencies"
  color: "0366d6"
  description: "Atualização de dependências"
- name: "skip-changelog"
  color: "ffffff"
  description: "Não aparece nas notas de versão"
- name: "good first issue"
  color: "7057ff"
  description: "Boa para começar"
