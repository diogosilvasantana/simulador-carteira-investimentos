# Perfil para rodar tudo no PC: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Banco em arquivo (H2), para o dev.cmd não depender de Docker (ADR-013). Os dados ficam fora do
# repositório, para nunca irem parar num commit.
server:
  # Sem login ainda: ninguém mais na rede pode abrir as finanças pessoais.
  address: 127.0.0.1

spring:
  autoconfigure:
    exclude:
      # A estrutura de eventos do Modulith só existe no PostgreSQL.
      - org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration
      - org.springframework.modulith.events.config.EventPublicationAutoConfiguration
  datasource:
    # WRITE_DELAY=0: grava antes de responder; o padrão do H2 espera 500 ms e perderia dados quando o
    # dev.cmd -Stop encerra o processo à força.
    url: jdbc:h2:file:${simulador.local.data-dir}/simulador;WRITE_DELAY=0
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/common

simulador:
  local:
    data-dir: ${SIMULADOR_DATA_DIR:${user.home}/.simulador-carteira}
  personal-finance:
    enabled: true
  ingest:
    token: ${INGEST_TOKEN:local-dev-token}

logging:
  level:
    br.com.simuladorcarteira.marketdata: DEBUG
