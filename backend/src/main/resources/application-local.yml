# Perfil para rodar tudo no PC: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# O dev.cmd roda sem Docker, então o perfil local usa um H2 em arquivo no lugar do PostgreSQL
# (ADR-013). A carteira fica em backend/data/ e sobrevive a reinícios; apague a pasta para zerar.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/simulador;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
simulador:
  ingest:
    token: ${INGEST_TOKEN:local-dev-token}

logging:
  level:
    br.com.simuladorcarteira.marketdata: DEBUG
