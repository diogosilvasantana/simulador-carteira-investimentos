spring:
  application:
    name: simulador-carteira
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

simulador:
  # Custos de negociação versionados por data: emolumentos e liquidação da B3 sobre o volume.
  # A corretagem é zero, como na maioria das corretoras para pessoa física.
  portfolio:
    trading-costs:
      - valid-from: "2019-01-01"
        fee-percent: 0.03
  ingest:
    # Segredo da ponte MT5 / simulador de pregão. Vazio = ingestão desligada.
    token: ${INGEST_TOKEN:}
  realtime:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
    # Intervalo dos lotes de cotações para o navegador (ADR-010)
    flush-interval-ms: 500
  fixedincome:
    bcb:
      base-url: ${BCB_BASE_URL:https://api.bcb.gov.br}
    sync:
      # Histórico buscado na primeira carga; a sincronização roda na subida e às 8h e 20h.
      backfill-years: 3
    # Produtos modelo pós-fixados para treinar: taxas típicas de mercado, não ofertas reais.
    # O Tesouro Selic é aproximado por 100% do CDI, que anda colado na Selic over.
    products:
      - id: tesouro-selic
        name: Tesouro Selic
        kind: TESOURO_SELIC
        index-percentage: 100
        income-tax-exempt: false
        grace-period-days: 0
      - id: cdb-100
        name: CDB liquidez diária 100% do CDI
        kind: CDB
        index-percentage: 100
        income-tax-exempt: false
        grace-period-days: 0
      - id: cdb-105
        name: CDB 105% do CDI
        kind: CDB
        index-percentage: 105
        income-tax-exempt: false
        grace-period-days: 0
      - id: cdb-110
        name: CDB 110% do CDI
        kind: CDB
        index-percentage: 110
        income-tax-exempt: false
        grace-period-days: 0
      # Resolução CMN 5.215/2025: prazo mínimo de seis meses para LCI e LCA sem índice de preços.
      # Seis meses têm de 181 a 184 dias; o maior evita mostrar resgate antes da hora.
      - id: lci-92
        name: LCI 92% do CDI
        kind: LCI
        index-percentage: 92
        income-tax-exempt: true
        grace-period-days: 184
      - id: lca-90
        name: LCA 90% do CDI
        kind: LCA
        index-percentage: 90
        income-tax-exempt: true
        grace-period-days: 184
    # Tabelas versionadas pela data de vigência (ADR-011). Mudou a lei? Acrescente uma tabela com
    # o novo valid-from em vez de editar a antiga.
    taxes:
      income-tax:
        # Lei 11.033/2004: IR regressivo sobre o rendimento, pelo prazo em dias corridos
        - valid-from: "2005-01-01"
          brackets:
            - up-to-days: 180
              rate-percent: 22.5
            - up-to-days: 360
              rate-percent: 20
            - up-to-days: 720
              rate-percent: 17.5
            - rate-percent: 15
      iof:
        # Decreto 6.306/2007 (anexo): IOF regressivo nos resgates com menos de 30 dias
        - valid-from: "2008-01-01"
          daily-rates-percent: [96, 93, 90, 86, 83, 80, 76, 73, 70, 66, 63, 60, 56, 53, 50, 46, 43, 40, 36, 33, 30, 26, 23, 20, 16, 13, 10, 6, 3]
