spring:
  application:
    name: simulador-carteira
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

simulador:
  ingest:
    # Segredo da ponte MT5 / simulador de pregão. Vazio = ingestão desligada.
    token: ${INGEST_TOKEN:}
  realtime:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
