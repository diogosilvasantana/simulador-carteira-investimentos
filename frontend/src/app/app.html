<nav class="nav" aria-label="Principal">
  <a class="nav__brand" routerLink="/" aria-label="Simulador de Carteira, início">
    <app-brand-mark />
    <span class="nav__brand-name">Simulador de Carteira</span>
  </a>

  <ul class="nav__list">
    @for (item of items; track item.path) {
      <li>
        <a
          class="nav__item"
          [routerLink]="item.path"
          routerLinkActive="nav__item--active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          [attr.title]="collapsed() ? item.label : null"
        >
          <app-icon [name]="item.icon" />
          <span class="nav__label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="nav__foot">
    <button
      type="button"
      class="nav__toggle"
      (click)="toggle()"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Abrir menu' : 'Recolher menu'"
    >
      <app-icon [name]="collapsed() ? 'expand' : 'collapse'" [size]="18" />
      <span class="nav__label">Recolher</span>
    </button>
  </div>
</nav>

<div class="main">
  <header class="topline">
    @if (onQuotes()) {
      <span [class]="'status status--' + stream.state()" role="status">{{
        stateLabel[stream.state()]
      }}</span>
    } @else {
      <span></span>
    }
    <span class="sim" title="Nenhuma ordem chega à B3">SIMULADO</span>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
