<h1>Simulador de carteira de investimentos</h1>
<p class="lead">
  Pratique a montagem e a gestão de carteiras com cotações reais da B3, sem arriscar dinheiro.
</p>

<h2>Roadmap</h2>
<ol class="phases">
  @for (phase of phases(); track phase.name) {
    <li>
      <strong>{{ phase.name }}</strong>
      <span>{{ phase.description }}</span>
    </li>
  }
</ol>
