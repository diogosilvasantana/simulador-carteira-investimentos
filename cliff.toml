# Configuração do git-cliff: gera o CHANGELOG.md a partir dos Conventional Commits.

[changelog]
header = """
# Changelog

Todas as mudanças relevantes do projeto. Formato baseado em
[Keep a Changelog](https://keepachangelog.com/pt-BR/1.1.0/) e versionamento
[SemVer](https://semver.org/lang/pt-BR/).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Não lançado]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}💥 {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Novidades" },
  { message = "^fix", group = "<!-- 1 -->🐛 Correções" },
  { message = "^perf", group = "<!-- 2 -->⚡ Desempenho" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refatorações" },
  { message = "^docs", group = "<!-- 4 -->📝 Documentação" },
  { message = "^test", group = "<!-- 5 -->✅ Testes" },
  { message = "^(build|ci)", group = "<!-- 6 -->👷 Build e CI" },
  { message = "^(chore|style)", group = "<!-- 7 -->🔧 Manutenção" },
  { message = "^revert", group = "<!-- 8 -->⏪ Reversões" },
]
